name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must equal the `packageManager` field in package.json — `bun run check:release` enforces it.
  BUN_VERSION: 1.3.14

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # tokens are generated, and typecheck imports them
      - run: bun run build
      # The tracked generated artifacts must be exactly what a clean build produces. Without
      # this, `component-manifest.json` and the brand logo components can drift from their
      # generators and ship metadata or markup nobody reviewed.
      - name: generated artifacts are current and reproducible
        run: git diff --exit-code -- component-manifest.json src/brand/logos
      # types, lint, tests, architecture, API lock, a11y, tokens, contrast
      - run: bun run verify

  browser:
    # The only place in this repository where `inert`, focus containment, reflow at 200% zoom
    # and pointer hit-testing are actually verified. jsdom implements none of them, so until
    # this job existed every one of those claims was a comment next to an assertion about an
    # attribute. See docs/standards/testing.md.
    #
    # Deliberately NOT part of `bun run verify`. It needs a Playwright Chromium build
    # (~200 MB for the headless shell), and a gate that makes a first-time `verify` download
    # 200 MB is a gate developers work around. Locally it is `bun run test:browser`, after
    # `bunx playwright install chromium` once. Here it is required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The browser suite imports src/styles/index.css for real — the reflow assertions are
      # meaningless without compiled Tailwind — and index.css imports the generated tokens.
      - run: bun run build:tokens
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser

  coverage:
    # `verify` runs the suite once without instrumentation and `check:coverage` only governs the
    # floors file; this job is where the floors in scripts/config/coverage-baseline.json actually
    # bite. Separate rather than folded into `verify` because running 1,700 tests twice in one
    # local command is a worse trade than one more parallel job here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # src/foundations/token-values.ts is generated and the suite imports it.
      - run: bun run build:tokens
      - run: bun run test:coverage

  package:
    runs-on: ubuntu-latest
    # `check:package` fails closed when a consumer pass cannot run. The Vite and Tailwind passes
    # are hermetic (this repo's own vite/tailwindcss), so they always run here. The Next.js RSC
    # pass needs the sibling qeetrix-docs app installed, which this workflow cannot do without a
    # cross-repository token — so it is skipped *explicitly and visibly*, never silently.
    #
    # To enable it: check this repo out into `qeetrix-ui/` and qeetrix-docs into
    # `qeetrix-docs/` under the workspace, `bun install` in both, and delete this env var.
    env:
      QEETRIX_SKIP_NEXT_CONSUMER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # packs the tarball and compiles real consumers against it
      - run: bun run verify:package

  changeset:
    # A published surface change without a changeset is a silent release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: a changeset is present
        run: bunx changeset status --since=origin/${{ github.event.pull_request.base.ref }}

  release-gate:
    # Reported separately from `verify` on purpose: every failure here is a decision or a
    # credential (licence posture, lockfile, registry), never a code defect, so it must not be
    # confused with a broken build. It is required before publication — see
    # docs/governance/release.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run check:release
